<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin">
  <title>GameJoy OBS Arrow</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
    #status {
      position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%);
      padding: 8px 13px; border: 1px solid rgba(89, 225, 255, .24); border-radius: 999px;
      background: rgba(8, 17, 29, .82); color: #d9f8ff;
      font: 600 13px system-ui, sans-serif; letter-spacing: .02em;
    }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="arrow" aria-hidden="true"></canvas>
  <div id="status" role="status" hidden></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('arrow');
      const ctx = canvas.getContext('2d', { alpha: true });
      const status = document.getElementById('status');
      const token = location.hash.slice(1);
      const debug = new URLSearchParams(location.search).get('debug') === '1';
      const deadZone = 0.1;
      const staleAfterMs = 2400;
      let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
      let targetActive = false, lastPacketAt = 0, lastFrameAt = 0, pixelRatio = 1;

      function setStatus(message) {
        status.textContent = message;
        status.hidden = !debug || !message;
      }

      function resize() {
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.round(window.innerWidth * pixelRatio));
        const height = Math.max(1, Math.round(window.innerHeight * pixelRatio));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

      function acceptInput(data) {
        if (!data || !Number.isFinite(data.x) || !Number.isFinite(data.y) ||
            data.x < -1 || data.x > 1 || data.y < -1 || data.y > 1) return;
        targetX = data.x;
        targetY = data.y;
        targetActive = data.active === true && Math.hypot(targetX, targetY) > deadZone;
        lastPacketAt = performance.now();
      }

      function project(worldX, worldY, originX, originY, scale) {
        // Positive Y means forward (up the ground plane); perspective shrinks it toward the horizon.
        const perspective = clamp(1 / (1 + worldY / (scale * 2.6)), 0.72, 1.28);
        return {
          x: originX + worldX * perspective,
          y: originY - worldY * 0.36 * perspective,
          perspective
        };
      }

      function traceArrow(points) {
        ctx.beginPath();
        ctx.moveTo(points.start.x, points.start.y);
        ctx.quadraticCurveTo(points.control.x, points.control.y, points.tip.x, points.tip.y);
      }

      function drawArrowHead(tip, control, size, perspective) {
        const dx = tip.x - control.x;
        const dy = tip.y - control.y;
        const angle = Math.atan2(dy, dx);
        const back = size * 1.35 * perspective;
        const half = size * 0.76 * perspective;
        const baseX = tip.x - Math.cos(angle) * back;
        const baseY = tip.y - Math.sin(angle) * back;
        const wingX = Math.cos(angle + Math.PI / 2) * half;
        const wingY = Math.sin(angle + Math.PI / 2) * half;

        ctx.beginPath();
        ctx.moveTo(tip.x, tip.y + size * 0.16);
        ctx.lineTo(baseX + wingX, baseY + wingY + size * 0.16);
        ctx.lineTo(baseX - wingX, baseY - wingY + size * 0.16);
        ctx.closePath();
        ctx.fillStyle = 'rgba(3, 15, 28, .58)';
        ctx.fill();

        const gradient = ctx.createLinearGradient(baseX, baseY, tip.x, tip.y);
        gradient.addColorStop(0, '#458bff');
        gradient.addColorStop(1, '#71f2ff');
        ctx.beginPath();
        ctx.moveTo(tip.x, tip.y);
        ctx.lineTo(baseX + wingX, baseY + wingY);
        ctx.lineTo(baseX - wingX, baseY - wingY);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.shadowColor = 'rgba(65, 207, 255, .85)';
        ctx.shadowBlur = size * 0.42;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function render(now) {
        resize();
        const width = canvas.width / pixelRatio;
        const height = canvas.height / pixelRatio;
        const minSide = Math.min(width, height);
        const dt = lastFrameAt ? Math.min(64, now - lastFrameAt) : 16;
        lastFrameAt = now;
        const blend = 1 - Math.exp(-dt / 90);
        currentX += (targetX - currentX) * blend;
        currentY += (targetY - currentY) * blend;

        if (now - lastPacketAt > staleAfterMs) {
          targetX = 0;
          targetY = 0;
          targetActive = false;
        }

        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        ctx.clearRect(0, 0, width, height);
        const magnitude = Math.min(1, Math.hypot(currentX, currentY));
        const visible = targetActive || magnitude > deadZone;
        const opacity = visible ? Math.min(1, magnitude * 1.5) : 0;

        if (opacity > 0.01 && magnitude > 0.001) {
          ctx.save();
          ctx.globalAlpha = opacity;
          const originX = width * 0.5;
          const originY = height * 0.79;
          const length = minSide * (0.08 + 0.34 * magnitude);
          const dx = currentX / magnitude;
          const dy = currentY / magnitude;
          const worldX = dx * length;
          const worldY = dy * length;
          const bend = length * 0.12;
          const start = { x: originX, y: originY };
          const control = project(worldX * 0.5 - dy * bend, worldY * 0.5 + dx * bend,
            originX, originY, minSide);
          const tip = project(worldX, worldY, originX, originY, minSide);
          const points = { start, control, tip };
          const strokeWidth = Math.max(8, minSide * 0.018 * tip.perspective);

          // Dark extrusion and ground shadow give the curved arrow its 3D depth.
          ctx.save();
          ctx.translate(0, minSide * 0.012);
          traceArrow(points);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = strokeWidth * 1.6;
          ctx.strokeStyle = 'rgba(4, 15, 31, .64)';
          ctx.shadowColor = 'rgba(0, 0, 0, .48)';
          ctx.shadowBlur = minSide * 0.025;
          ctx.stroke();
          ctx.restore();

          traceArrow(points);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = strokeWidth;
          const shaft = ctx.createLinearGradient(start.x, start.y, tip.x, tip.y);
          shaft.addColorStop(0, '#478cff');
          shaft.addColorStop(0.55, '#4fcaff');
          shaft.addColorStop(1, '#8affff');
          ctx.strokeStyle = shaft;
          ctx.shadowColor = 'rgba(73, 213, 255, .92)';
          ctx.shadowBlur = minSide * 0.045;
          ctx.stroke();
          ctx.shadowBlur = 0;
          drawArrowHead(tip, control, minSide * 0.065, tip.perspective);

          ctx.beginPath();
          ctx.ellipse(originX, originY + minSide * 0.014, minSide * 0.038, minSide * 0.013,
            0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(31, 177, 255, .24)';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(originX, originY, minSide * 0.018, 0, Math.PI * 2);
          ctx.fillStyle = '#52dbff';
          ctx.shadowColor = '#52dbff';
          ctx.shadowBlur = minSide * 0.045;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(originX, originY, minSide * 0.007, 0, Math.PI * 2);
          ctx.fillStyle = '#efffff';
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(render);
      }

      if (!/^[a-f0-9]{64}$/.test(token)) {
        setStatus('Copia el enlace de GameJoy y cambia /obs/map por /obs/arrow');
      } else if (typeof io !== 'function') {
        setStatus('No se pudo conectar con el servidor de GameJoy');
      } else {
        setStatus('Conectando con GameJoy…');
        const socket = io({ autoConnect: false, reconnection: true });
        socket.on('connect', () => {
          setStatus('Esperando controles…');
          socket.emit('gamejoy:obs-subscribe', { token });
        });
        socket.on('gamejoy:obs-ready', () => setStatus('Overlay conectado'));
        socket.on('gamejoy:obs-input', acceptInput);
        socket.on('gamejoy:obs-stopped', () => {
          acceptInput({ x: 0, y: 0, active: false });
          setStatus('GameJoy dejó de compartir');
        });
        socket.on('gamejoy:obs-error', data => setStatus(data?.message || 'Overlay no disponible'));
        socket.on('disconnect', () => {
          acceptInput({ x: 0, y: 0, active: false });
          setStatus('Reconectando con GameJoy…');
        });
        socket.on('connect_error', () => setStatus('No se pudo conectar con el servidor'));
        socket.connect();
      }

      window.addEventListener('resize', resize, { passive: true });
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
