<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajustes de Flechas</title>
<link rel="stylesheet" href="../settings/panel.css">
<details class="arrow-settings" lang="es">
  <summary aria-keyshortcuts="F">Flechas · F</summary>
  <small>Suelo de 100 × 100 m · cada cuadro mide 1 m de lado</small>
  <label for="arrow-count">Máximo de flechas <output for="arrow-count"></output><input id="arrow-count" type="range" min="1" max="16" value="6"></label>
  <label for="arrow-side">X · Izquierda / derecha <output for="arrow-side"></output><input id="arrow-side" type="range" min="0" max="100" step="0.1" value="50"></label>
  <label for="arrow-depth">Z · Fondo / cámara <output for="arrow-depth"></output><input id="arrow-depth" type="range" min="0" max="100" step="0.1" value="50"></label>
  <label for="arrow-height">Y · Abajo / arriba <output for="arrow-height"></output><input id="arrow-height" type="range" min="-40" max="40" step="0.1" value="0"></label>
  <button type="button" id="preview-arrows">Previsualizar flechas</button>
  <label class="grid-control"><input id="show-grid" type="checkbox" checked>Cuadrícula del suelo durante la edición</label>
  <small id="camera-angle"></small>

</details>
<script src="../settings/panel.js"></script>
<script src="settings.js"></script>
</html>
