<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Arial,Helvetica,sans-serif}button{touch-action:none;user-select:none;cursor:pointer;color:white}.stick{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;border:2px solid #28ccff;background:radial-gradient(circle,#071b3caa 47%,#103a61dd 49%,#031735dc 51%,#031735dd 67%,#136c9d 69%,#02152f 71%);box-shadow:0 0 12px #009aff78}.stick span{position:absolute;color:#82ddff;font-size:8%}.up,.down{left:50%;translate:-50% 0}.up{top:4%}.down{bottom:4%}.left,.right{top:50%;translate:0 -50%}.left{left:5%}.right{right:5%}#thumb{position:absolute;inset:25%;border-radius:50%;background:radial-gradient(at 36% 25%,#276599,#103d69 47%,#03152e 85%);border:2px solid #64dbff;box-shadow:0 3px 8px #001022}.actions{position:absolute;inset:0}.actions button{position:absolute;width:35%;aspect-ratio:1;border-radius:50%;border:2px solid #32caff;background:radial-gradient(at 34% 22%,#174f7d,#051b39 65%);box-shadow:0 0 10px #039dff88,inset 0 0 6px #007ed7;display:grid;place-items:center}button svg{width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:3.8;stroke-linejoin:round}button[data-key="triangle"]{top:0;left:32.5%;color:#55efc0}button[data-key="square"]{top:32.5%;left:0;color:#ffa5e0}button[data-key="circle"]{top:32.5%;right:0;color:#ff9189}button[data-key="cross"]{bottom:0;left:32.5%;color:#82c7ff}button:active,button:focus-visible{outline:2px solid white;filter:brightness(1.35)}.actions.custom-color button{color:var(--button-accent);border-color:var(--button-accent);box-shadow:0 0 12px var(--button-accent),inset 0 0 7px var(--button-accent)}
</style><body><button type="button" class="stick" aria-label="Controle analógico de movimento"><span class="up">▲</span><span class="down">▼</span><span class="left">◀</span><span class="right">▶</span><i id="thumb"></i></button><div class="actions" role="group" aria-label="Botões de ação">
<button data-key="triangle" aria-label="Triângulo"><svg viewBox="0 0 40 40"><path d="m20 5 16 29H4z"/></svg></button>
<button data-key="square" aria-label="Quadrado"><svg viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28"/></svg></button>
<button data-key="circle" aria-label="Círculo"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/></svg></button>
<button data-key="cross" aria-label="Cruz"><svg viewBox="0 0 40 40"><path d="m7 7 26 26M33 7 7 33"/></svg></button>
</div><script src="../settings/bus.js"></script><script src="view.js"></script></body></html>
