<!doctype html>
<html lang="es">
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
.map-google, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.map-location-dot { position: absolute; z-index: 2; top: 50%; left: 50%; display: none;
  width: 6%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border: 3px solid white; border-radius: 50%; background: #1a73e8;
  box-shadow: 0 0 0 9px #1a73e844, 0 2px 5px #0007; pointer-events: none; }
body.google-ready .map-location-dot { display: block; }
</style>
<div class="map-google">
  <iframe title="Google Maps" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<span class="map-location-dot" role="img" aria-label="Punto azul de ubicación"></span>
<script src="../settings/bus.js"></script>
<script src="view.js?v=original-map-2"></script>
</html>
