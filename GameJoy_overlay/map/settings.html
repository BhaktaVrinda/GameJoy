<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajustes de Mapa</title>
<link rel="stylesheet" href="../settings/panel.css">
<details class="arrow-settings" lang="es">
  <summary aria-keyshortcuts="M">Mapa · M</summary>
  <button type="button" id="reset-minimap">Recuperar minimapa</button>
  <details class="map-size-settings">
    <summary>Tamaño del mapa</summary>
    <label for="map-size">Diámetro (% del ancho de pantalla) <output for="map-size">21 %</output><input id="map-size" type="range" min="10" max="55" value="21"></label>
  </details>
  <details class="map-zoom-settings">
    <summary>Zoom del mapa</summary>
    <label for="map-zoom">Nivel de zoom <output for="map-zoom">16</output><input id="map-zoom" type="range" min="3" max="21" value="16"></label>
    <div class="map-zoom-buttons">
      <button type="button" id="map-zoom-out" aria-label="Alejar mapa">−</button>
      <button type="button" id="map-zoom-in" aria-label="Acercar mapa">+</button>
    </div>
  </details>
  <details class="map-dot-settings">
    <summary>Posición del punto azul</summary>
    <label for="map-dot-distance">Distancia del centro <output for="map-dot-distance">0 %</output><input id="map-dot-distance" type="range" min="0" max="85" value="0"></label>
    <label for="map-dot-angle">Dirección (0° arriba, 90° derecha) <output for="map-dot-angle">0°</output><input id="map-dot-angle" type="range" min="0" max="359" value="0"></label>
    <button type="button" id="center-map-dot">Centrar punto azul</button>
  </details>
  <details class="map-animation-settings">
    <summary>Animaciones del mapa</summary>
    <label for="map-animation-distance">Distancia (% de pantalla) <output for="map-animation-distance">30 %</output><input id="map-animation-distance" type="range" min="5" max="150" value="30"></label>
    <label for="map-animation-duration">Duración <output for="map-animation-duration">1,2 s</output><input id="map-animation-duration" type="range" min="0.4" max="3" step="0.1" value="1.2"></label>
    <div class="map-animation-pad" role="group" aria-label="Dirección de la animación del mapa">
      <button type="button" data-dy="-1" aria-label="Animar mapa hacia arriba">▲</button>
      <button type="button" data-dx="-1" aria-label="Animar mapa hacia la izquierda">◀</button>
      <span aria-hidden="true">●</span>
      <button type="button" data-dx="1" aria-label="Animar mapa hacia la derecha">▶</button>
      <button type="button" data-dy="1" aria-label="Animar mapa hacia abajo">▼</button>
    </div>
    <button type="button" id="return-minimap">Volver al punto de partida</button>
  </details>

</details>
<script src="../settings/bus.js"></script>
<script src="../settings/panel.js"></script>
<script src="settings.js"></script>
</html>
