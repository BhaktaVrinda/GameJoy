<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin">
  <title>GameJoy · Directo y flecha</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent; color: #f0faff; font-family: Arial, Helvetica, sans-serif; }
    body { display: grid; place-items: center; }
    main { position: relative; width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9;
      container-type: inline-size; overflow: hidden; isolation: isolate; }
    #photo-background, #direct-view, #arrow-module { position: absolute; inset: 0;
      width: 100%; height: 100%; border: 0; }
    #photo-background { z-index: -2; background: center / 100% 100% no-repeat url("Imagen/madrid-calle-completa.webp"); }
    #direct-view { z-index: -1; pointer-events: none; display: none; background: #000; }
    #direct-view.active { display: block; }
    #arrow-module { z-index: 2; pointer-events: auto; }
    #buttons-3d { position: absolute; right: 3.6%; bottom: 5.4%; width: 14%; aspect-ratio: 1;
      z-index: 3; display: block; pointer-events: none; }
    #obs-logout-floating { position: absolute; z-index: 40; left: 3.2%; top: 1.1%;
      padding: 6px 10px; border: 1px solid #59e1ff88; border-radius: 9px;
      background: #08111dcc; color: #eafaff; font: 600 12px system-ui, sans-serif;
      cursor: pointer; }
    #obs-logout-floating:disabled { opacity: .65; cursor: wait; }
    #overlay-status { position: absolute; z-index: 20; left: 50%; bottom: 2%; transform: translateX(-50%);
      max-width: 90%; padding: 7px 12px; border: 1px solid #59e1ff55; border-radius: 999px;
      background: #08111dcc; color: #d9f8ff; font: 600 13px system-ui, sans-serif;
      text-align: center; white-space: nowrap; }
    #overlay-status[hidden] { display: none; }
    #obs-auth { position: absolute; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(92%, 420px); padding: 20px; border: 1px solid #59e1ff66; border-radius: 16px;
      background: #08111df2; color: #eafaff; box-shadow: 0 12px 42px #0009;
      font: 500 15px system-ui, sans-serif; text-align: center; }
    #obs-auth[hidden] { display: none; }
    #obs-auth p { margin: 0 0 14px; line-height: 1.45; }
    #obs-auth button { margin: 3px; padding: 8px 13px; border: 1px solid #59e1ff88;
      border-radius: 9px; background: #123b55; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main id="gamejoy-overlay" aria-label="GameJoy directo y flecha">
    <div id="photo-background" aria-hidden="true"></div>
    <iframe id="direct-view" title="Directo de GameJoy"
      allow="autoplay; fullscreen; microphone; camera; display-capture"
      allowfullscreen referrerpolicy="strict-origin"></iframe>
    <iframe id="arrow-module" title="Flecha nueva de GameJoy"
      src="/obs/overlay-assets/arrow/index.html?v=arrow-only-1"></iframe>
    <canvas id="buttons-3d" aria-label="Botones 3D de GameJoy"></canvas>
    <button id="obs-logout-floating" type="button" aria-label="Cerrar sesión de OBS">Cerrar sesión</button>
    <div id="overlay-status" role="status" hidden></div>
    <section id="obs-auth" role="dialog" aria-live="polite" hidden>
      <p id="obs-auth-message">La sesión de OBS no está abierta.</p>
      <button id="obs-auth-login" type="button">Abrir formulario GameJoy</button>
      <button id="obs-auth-logout" type="button">Cerrar sesión OBS</button>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/obs/overlay-assets/settings/bus.js"></script>
  <script type="module" src="/obs/overlay-assets/gamejoy-overlay.js?v=arrow-only-1"></script>
  <script type="module" src="/obs/overlay-assets/buttons-3d.js?v=buttons-1"></script>
</body>
</html>
